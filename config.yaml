output:
  dir: results

threads:
  fastp: 8
  bwa: 16
  pairtools: 12
  cooler: 8

reference:
  bwa_indexed_fasta: /path/to/genome.fa
  chrom_sizes: /path/to/genome.chrom.sizes

alignment:
  aligner: bwa-mem2   # bwa-mem2 or bwa-mem

samples:
  # ---- Micro-C sample (protocol defaults: 1kb base resolution, no distance
  # filter). same_fragment_max_dist removes unligated/self-ligated mono-
  # nucleosome fragments (cis "+-" convergent pairs closer than the cutoff;
  # mono-nucleosome fragments are ~147-200 bp).
  sample_micro_c:
    protocol: micro-c
    enzyme: mnase
    same_fragment_max_dist: 200
    R1:
      - /path/to/sample_micro_c_R1.fastq.gz
    R2:
      - /path/to/sample_micro_c_R2.fastq.gz
  # ---- Hi-C sample (protocol defaults: 5kb base resolution, 1kb short-cis
  # artifact cutoff for self-ligation products of 4-cutter REs). Enzyme
  # parameters are metadata + drive protocol defaults; all settings can be
  # overridden per sample (base_resolution, resolutions,
  # max_cis_artifact_dist, same_fragment_max_dist, min_mapq, require_unique).
  sample_hi_c:
    protocol: hi-c
    enzyme: mboi
    cut_sites: GATC
    min_frag_size: 100
    max_frag_size: 10000
    R1:
      - /path/to/sample_hi_c_R1.fastq.gz
    R2:
      - /path/to/sample_hi_c_R2.fastq.gz


fastp:
  # Read-level PCR dedup (fastp --dedup) is NOT standard practice for Hi-C/
  # Micro-C: distiller-nf dedups only at the pair level (pairtools dedup).
  # fastp --dedup is RAM-hungry and can remove genuine ligation products that
  # share identical read sequences, so it is disabled by default.
  dedup: false
  detect_adapter: true

pairs:
  # Number of read-name buckets for the parallel pairtools parse step
  # (split name-sorted bam by read-name hash -> parse buckets in parallel ->
  # concatenate). Each bucket runs its own parse process, so total parse
  # throughput scales ~linearly with bucket count (subject to --cores).
  # Measured on dm6: 8 buckets ~= 5.7x faster parse than a single process.
  parse_buckets: 8
  dedup:
    # Max mismatch (bp) allowed on either side for two pairs to count as
    # duplicates. distiller-nf uses 1; pairtools default is 3.
    max_mismatch: 1
  filter:
    min_mapq: 30
    # CAUTION: this threshold drops ALL cis contacts whose mapped ends are
    # closer than `max_cis_artifact_dist` bp. It was designed for Hi-C
    # (6-cutter) where short-cis pairs are mostly self-circularized fragments.
    # Micro-C fragments are ~100-1000 bp, so <1kb cis contacts are predominantly
    # REAL signal (adjacent-nucleosome contacts). With Micro-C, leaving this at
    # 1000 removes ~2/3 of all contacts (verified on a shallow dm6 library).
    # Keep it 0 for Micro-C.
    max_cis_artifact_dist: 0
    # Remove unligated/self-ligated SAME-FRAGMENT pairs: cis pairs in
    # convergent (+-) orientation closer than this many bp (under upper-triangle
    # normalization the stored orientation of a same-fragment pair is always
    # "+-"). Mono-nucleosome fragments are ~147-200 bp, so 200 removes the
    # same-fragment product while keeping real adjacent-nucleosome contacts
    # (>= ~250 bp) and everything above 1 kb. 0 disables. Per-sample override:
    # samples.<name>.same_fragment_max_dist
    same_fragment_max_dist: 0
    enable_blacklist: false
    blacklist_bed: ""
    # Restrict to uniquely-mapped read pairs only (pair_type=="UU"). Set to
    # false (recommended, distiller-parity) to also keep UR/RU pairs: these are
    # RESCUED single-ligation products (a chimeric read whose 3' part was
    # rescued by pairtools parse), i.e. real contacts, ~30% more usable pairs.
    require_unique: false

matrix:
  base_resolution: 1000
  # Defaults applied to samples whose protocol is "hi-c" unless overridden
  # per sample (samples.<name>.base_resolution / max_cis_artifact_dist).
  # 4-cutter (MboI/DpnII) fragments are mostly <1kb, so cis pairs below
  # hic_cis_artifact_dist are dominated by self-ligation products; HiC-Pro /
  # distiller-style filtering drops them. base 5kb matches the effective
  # resolution of Hi-C (fragments ~100bp-10kb, median ~1-4kb).
  hic_base_resolution: 5000
  hic_cis_artifact_dist: 1000
  # base_resolution must be a common denominator of all entries (1000 divides
  # all). 250kb-10Mb levels mirror distiller-nf's output. 500kb is also used
  # by qc.replicate_concordance.
  resolutions: [1000, 2000, 5000, 10000, 20000, 50000, 100000, 250000, 500000, 1000000, 2500000, 5000000, 10000000]
  # Assembly name stamped into .cool metadata via `cooler cload --assembly`.
  # Leave empty ("") to skip.
  assembly: dm6
  # Threads for `cooler zoomify --nproc` (multi-level balancing).
  zoomify_threads: 8
  # Contigs shorter than this are dropped from expected/insulation/QC/feature
  # analysis (dm6 chrom.sizes has ~1860 tiny chrUn contigs that crash
  # cooltools insulation and produce NaN compartment bins).
  min_chrom_size: 1000000
  export_hic: false
  hic_threads: 8
  hic_tmpdir: ""

features:
  # resolutions at which to call A/B compartments (used by call_compartments)
  compartment_resolutions: [5000]
  insulation_window: 100000
  feature_resolution: 5000
  balance_max_iters: 500
  # flank (bp) around loop anchors for coolpuppy APA pileups
  apa_flank: 100000
  # Number of random shifted-anchor pileups for APA background estimation
  apa_nshifts: 100
  # Min number of finite E1 bins per chromosome to keep it in the
  # compartment-correlation table (chrY often has only a handful of bins).
  compartment_min_bins_per_chrom: 50

balance:
  # Resolutions (bp) at which the single balance rule computes ICE weights.
  # The per-sample base resolution is added automatically. All feature/QC
  # rules depend on this rule's output; weights are verified converged
  # (convergence-policy discard + explicit check) or the rule fails.
  resolutions: [5000]
  # Fall back to cis-only balancing if genome-wide balancing does not
  # converge; fail if cis-only also fails to converge.
  cis_only_fallback: true

qc:
  # Resolutions (bp) at which replicate concordance (genome-wide Pearson /
  # Spearman of balanced cis matrices) is computed. Resolutions must exist in
  # matrix.resolutions.
  concordance_resolutions: [100000, 500000]
  # Distance strata (bp, [lo, hi); 0 = open-ended) for distance-stratified
  # replicate concordance. Correlations are computed per stratum after
  # downsampling both samples to the same number of pixels.
  concordance_strata:
    - [5000, 20000]
    - [20000, 100000]
    - [100000, 500000]
    - [500000, 2000000]
    - [2000000, 0]
  # Boundary overlap: one-to-one matching tolerance (bp) between boundary
  # midpoints; default 2 bins at 5kb resolution.
  boundary_tolerance_bp: 10000
  # Per-sample QC gates: samples failing any gate are marked
  # failed/underpowered in qc_gates.tsv and should be excluded from
  # differential/between-sample conclusions.
  gates:
    min_valid_pairs: 10000000
    min_frac_cis: 0.90
    max_frac_dups: 0.85

# Differential analysis. Each group maps a condition name to a list of
# samples; samples may appear in at most one group, and groups do NOT have to
# cover all configured samples (use only protocol/biology-matched samples).
# Leave empty to skip differential matrix/compartment comparisons.
groups: {}
differential:
  # Compartment flip analysis only considers bins with |E1| above this
  # threshold in at least one group (near-zero E1 values would otherwise be
  # counted as "flips").
  flip_min_e1: 0.05
#  groups:
#    wildtype:
#      - sampleA
#    knockout:
#      - sampleB
